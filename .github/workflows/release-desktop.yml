name: Release desktop app

# Builds the Windows installer and publishes it to this repo's GitHub Releases,
# which is also where electron-updater looks for updates. Fully automatic:
# bumping desktop/package.json's version and pushing to main is the entire
# "ship a new version" step — no manual dispatch required (that still works
# too, for a forced re-run of the current version).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Every push to main lands here, most of which aren't a version bump — so
  # only actually build when the current version isn't already out as a
  # release (a manual dispatch always builds, unconditionally).
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $tag already exists — skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "no release for $tag yet — building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: [check]
    if: always() && needs.check.result != 'failure' && (github.ref != 'refs/heads/main' || needs.check.outputs.should_build == 'true')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Deliberately NOT /releases/latest: that returns the newest
      # non-prerelease, which for llama.cpp is a version tag carrying only a
      # nightly-tag.txt marker. The actual Windows binaries ship on their
      # per-build releases, which are flagged as prereleases. So: walk the
      # releases list newest-first and take the first one that actually has
      # Windows CUDA x64 binaries attached. Matching on "contains win AND cuda
      # AND x64" rather than an ordered regex, since their exact filename
      # layout (cuda toolkit version, field order) has shifted before.
      - name: Fetch llama.cpp (Windows, CUDA)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ "User-Agent" = "jio-build"; "Authorization" = "Bearer $env:GH_TOKEN" }
          $url = "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=50"
          $releases = Invoke-RestMethod -Headers $headers -Uri $url

          function Is-WinCuda($name) {
            return ($name -match "(?i)win") -and ($name -match "(?i)cuda") -and
                   ($name -match "(?i)(x64|amd64)") -and ($name -match "(?i)\.zip$") -and
                   ($name -notmatch "(?i)arm")
          }
          function Is-Cudart($name) {
            return ($name -match "(?i)^cudart") -and ($name -match "(?i)\.zip$") -and
                   ($name -match "(?i)(x64|amd64)")
          }

          $chosen = $null
          foreach ($rel in $releases) {
            if ($rel.assets | Where-Object { Is-WinCuda $_.name }) { $chosen = $rel; break }
          }

          if (-not $chosen) {
            Write-Host "no release in the newest 50 had Windows CUDA x64 assets. What was there:"
            foreach ($rel in $releases | Select-Object -First 10) {
              Write-Host "  $($rel.tag_name) (prerelease=$($rel.prerelease)):"
              $rel.assets | ForEach-Object { Write-Host "      $($_.name)" }
            }
            throw "could not find llama.cpp Windows CUDA binaries — see the listing above and adjust Is-WinCuda in this step"
          }

          Write-Host "using llama.cpp release $($chosen.tag_name) (prerelease=$($chosen.prerelease))"
          $wanted = $chosen.assets | Where-Object { (Is-WinCuda $_.name) -or (Is-Cudart $_.name) }
          Write-Host "matched assets:"
          $wanted | ForEach-Object { Write-Host "  $($_.name)" }

          New-Item -ItemType Directory -Force -Path resources/llama | Out-Null
          foreach ($asset in $wanted) {
            Write-Host "downloading $($asset.name)"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$($asset.name)"
            Expand-Archive -Path "$($asset.name)" -DestinationPath resources/llama -Force
          }
          Get-ChildItem resources/llama -Recurse -File | Select-Object -ExpandProperty Name

      # The zips have shipped both flat and nested (build/bin/...) depending on
      # version, and main.js expects llama-server.exe directly in resources/llama,
      # so flatten whatever layout arrived rather than assuming one.
      - name: Confirm llama-server.exe landed
        shell: pwsh
        run: |
          $exe = Get-ChildItem resources/llama -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem resources/llama -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "llama-server.exe not found anywhere under resources/llama — see the listing above"
          }
          $root = (Resolve-Path "resources/llama").Path
          if ($exe.DirectoryName -ne $root) {
            Write-Host "flattening from $($exe.DirectoryName)"
            Get-ChildItem $exe.DirectoryName -File | ForEach-Object { Move-Item $_.FullName $root -Force }
          }
          if (-not (Test-Path "resources/llama/llama-server.exe")) { throw "flattening did not put llama-server.exe at the expected path" }
          Write-Host "ok — llama-server.exe in place, alongside:"
          Get-ChildItem resources/llama -File | Select-Object -ExpandProperty Name

      - run: npm ci

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS. Runs after the Windows job rather than beside it so the two aren't
  # racing to create the same GitHub release, and one arch at a time for the
  # same reason. Each arch gets its OWN llama.cpp build — the binaries are
  # native, and extraResources copies one resources/llama into whatever is
  # being packaged, so arm64 and x64 can't share a checkout.
  build-mac:
    needs: [check, build-windows]
    if: always() && needs.build-windows.result == 'success'
    runs-on: macos-latest
    strategy:
      max-parallel: 1
      matrix:
        arch: [arm64, x64]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Same shape as the Windows fetch above, and for the same reason: match
      # on what the filename CONTAINS (macos + this arch) rather than an
      # ordered regex, since llama.cpp's exact naming has shifted before. The
      # Windows binaries ship on prereleases, so walk the list newest-first
      # and take the first release that actually carries what we need.
      - name: Fetch llama.cpp (macOS, ${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "User-Agent: jio-build" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=50" -o releases.json

          asset=$(python3 - "$ARCH" <<'PY'
          import json, sys
          arch = sys.argv[1].lower()
          alts = {'x64': ['x64', 'x86_64', 'amd64'], 'arm64': ['arm64', 'aarch64']}[arch]
          # .tar.gz as well as .zip: llama.cpp ships Windows as zips but macOS
          # (and Linux) as tarballs, which is what this step first tripped on.
          for rel in json.load(open('releases.json')):
              for a in rel.get('assets', []):
                  n = a['name'].lower()
                  if 'macos' in n and n.endswith(('.zip', '.tar.gz')) and any(t in n for t in alts):
                      print(a['browser_download_url'])
                      sys.exit(0)
          PY
          ) || true

          if [ -z "$asset" ]; then
            echo "no release in the newest 50 had a macOS $ARCH build. What was there:"
            python3 -c "
          import json
          for rel in json.load(open('releases.json'))[:10]:
              print(' ', rel['tag_name'])
              for a in rel.get('assets', []): print('     ', a['name'])
          "
            echo "adjust the matcher in this step to suit"
            exit 1
          fi

          echo "downloading $asset"
          mkdir -p resources/llama llama-unpacked
          case "$asset" in
            *.tar.gz) curl -sSL "$asset" -o llama-mac.tar.gz
                      tar -xzf llama-mac.tar.gz -C llama-unpacked ;;
            *)        curl -sSL "$asset" -o llama-mac.zip
                      unzip -q -o llama-mac.zip -d llama-unpacked ;;
          esac

      # The zips have shipped both flat and nested (build/bin/...) depending on
      # version, and main.js expects llama-server directly in resources/llama.
      - name: Put llama-server in place
        run: |
          set -euo pipefail
          exe=$(find llama-unpacked -type f -name 'llama-server' | head -n1)
          if [ -z "$exe" ]; then
            echo "llama-server not found anywhere in the archive:"
            find llama-unpacked -type f | head -50
            exit 1
          fi
          # take the whole directory it lives in — the server needs the dylibs
          # that ship beside it, not just the one executable
          cp -R "$(dirname "$exe")"/* resources/llama/
          chmod +x resources/llama/llama-server
          echo "ok — llama-server in place, alongside:"
          ls resources/llama

      - run: npm ci

      # Unsigned: shipping a signed/notarized mac build needs a paid Apple
      # Developer account and its certificate in CI secrets, neither of which
      # exists here. CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder
      # from hunting the keychain for one and failing the build over it.
      - name: Build and publish
        run: npm run release -- --mac --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
